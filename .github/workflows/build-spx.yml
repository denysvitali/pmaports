name: Build Surface Pro X packages

on:
  push:
    branches: [feature/spx]
    paths:
      - 'device/testing/device-microsoft-surface-pro-x/**'
      - 'device/testing/firmware-microsoft-surface-pro-x/**'
      - 'device/testing/linux-postmarketos-qcom-sc8180x-surface/**'
      - '.github/workflows/build-spx.yml'
  pull_request:
    branches: [master]
    paths:
      - 'device/testing/device-microsoft-surface-pro-x/**'
      - 'device/testing/firmware-microsoft-surface-pro-x/**'
      - 'device/testing/linux-postmarketos-qcom-sc8180x-surface/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pmaports
        uses: actions/checkout@v4

      - name: Install pmbootstrap
        run: pip install git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git

      - name: Configure pmbootstrap
        run: |
          # Add upstream remote so pmbootstrap can validate the pmaports repo
          git -C "$GITHUB_WORKSPACE" remote add upstream https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 upstream master

          # Create config directory and write minimal config
          mkdir -p ~/.config/pmbootstrap
          cat > ~/.config/pmbootstrap/pmbootstrap.cfg <<'PMCFG'
          [pmbootstrap]
          device = microsoft-surface-pro-x
          ui = none
          build_default_device_arch = True
          extra_packages = none
          boot_size = 256
          extra_space = 0
          hostname = surface-pro-x
          channel = edge
          PMCFG
          sed -i 's/^          //' ~/.config/pmbootstrap/pmbootstrap.cfg

          pmbootstrap --aports "$GITHUB_WORKSPACE" --details-to-stdout work_migrate

      - name: Build firmware-microsoft-surface-pro-x
        run: pmbootstrap -y --aports "$GITHUB_WORKSPACE" --details-to-stdout build firmware-microsoft-surface-pro-x

      - name: Build linux-postmarketos-qcom-sc8180x-surface
        run: pmbootstrap -y --aports "$GITHUB_WORKSPACE" -j "$(nproc)" --details-to-stdout build linux-postmarketos-qcom-sc8180x-surface

      - name: Build device-microsoft-surface-pro-x
        run: pmbootstrap -y --aports "$GITHUB_WORKSPACE" --details-to-stdout build device-microsoft-surface-pro-x

      - name: Build disk image
        run: pmbootstrap -y --aports "$GITHUB_WORKSPACE" --details-to-stdout install --no-fde

      - name: Collect artifacts
        run: |
          work="$(pmbootstrap --aports "$GITHUB_WORKSPACE" config work)"
          mkdir -p output

          # Copy built packages
          cp "$work"/packages/edge/aarch64/*.apk output/ || true

          # Copy disk image
          cp "$work"/chroot_native/home/pmos/rootfs/microsoft-surface-pro-x.img output/ || true

          # Compress the disk image
          if [ -f output/microsoft-surface-pro-x.img ]; then
            xz -T0 -9 output/microsoft-surface-pro-x.img
          fi

          ls -lh output/

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: spx-packages
          path: output/*.apk
          retention-days: 30

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: spx-disk-image
          path: output/*.img.xz
          retention-days: 30
