name: Build Surface Pro X packages

on:
  push:
    branches: [feature/spx]
    paths:
      - 'device/testing/device-microsoft-surface-pro-x/**'
      - 'device/testing/firmware-microsoft-surface-pro-x/**'
      - 'device/testing/linux-postmarketos-qcom-sc8180x-surface/**'
      - '.github/workflows/build-spx.yml'
  pull_request:
    branches: [master]
    paths:
      - 'device/testing/device-microsoft-surface-pro-x/**'
      - 'device/testing/firmware-microsoft-surface-pro-x/**'
      - 'device/testing/linux-postmarketos-qcom-sc8180x-surface/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PMBOOTSTRAP_WORK: /home/runner/.local/var/pmbootstrap
  PMBOOTSTRAP_PACKAGES: /home/runner/.local/var/pmbootstrap/packages/edge/aarch64
  KERNEL_RELEASES_BASE: https://github.com/denysvitali/linux-surface/releases/download

jobs:
  build-firmware:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout pmaports
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-pmbootstrap-${{ hashFiles('.github/workflows/build-spx.yml') }}

      - name: Cache pmbootstrap distfiles
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/cache_distfiles
          key: ${{ runner.os }}-${{ runner.arch }}-distfiles-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-distfiles-v1

      - name: Cache APK packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/cache_apk
          key: ${{ runner.os }}-${{ runner.arch }}-apk-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apk-v1

      - name: Cache chroot
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/chroot_native
          key: ${{ runner.os }}-${{ runner.arch }}-chroot-firmware-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chroot-firmware-v1

      - name: Install pmbootstrap
        run: pip install --cache-dir /home/runner/.cache/pip git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git

      - name: Configure pmbootstrap
        run: |
          git -C "$GITHUB_WORKSPACE" remote add upstream https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 upstream main

          printf '[pmbootstrap]\ndevice = microsoft-surface-pro-x\nui = none\nbuild_default_device_arch = True\nextra_packages = none\nboot_size = 256\nextra_space = 0\nhostname = surface-pro-x\nchannel = edge\n' > ~/.config/pmbootstrap_v3.cfg

          mkdir -p $PMBOOTSTRAP_WORK
          echo "8" > $PMBOOTSTRAP_WORK/version
          pmbootstrap --aports "$GITHUB_WORKSPACE" --details-to-stdout work_migrate

      - name: Build firmware-microsoft-surface-pro-x
        run: pmbootstrap -y --aports "$GITHUB_WORKSPACE" --details-to-stdout build firmware-microsoft-surface-pro-x

      - name: Upload firmware packages
        uses: actions/upload-artifact@v4
        with:
          name: firmware-packages
          path: ${{ env.PMBOOTSTRAP_PACKAGES }}/firmware-microsoft-surface-pro-x-*.apk
          retention-days: 30

  download-kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout pmaports
        uses: actions/checkout@v4

      - name: Get latest kernel release
        id: get-release
        run: |
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/denysvitali/linux-surface/releases?per_page=1" | jq -r '.[0].tag_name')
          echo "Latest release: $LATEST_RELEASE"
          echo "tag_name=$LATEST_RELEASE" >> $GITHUB_OUTPUT

      - name: Download prebuilt kernel artifacts
        run: |
          RELEASE_TAG="${{ steps.get-release.outputs.tag_name }}"
          echo "Downloading kernel from release: $RELEASE_TAG"
          mkdir -p kernel-artifacts
          cd kernel-artifacts

          # Download all required artifacts
          curl -sL "${{ env.KERNEL_RELEASES_BASE }}/$RELEASE_TAG/Image.gz" -o Image.gz
          curl -sL "${{ env.KERNEL_RELEASES_BASE }}/$RELEASE_TAG/sc8180x-surface-pro-x.dtb" -o sc8180x-surface-pro-x.dtb
          curl -sL "${{ env.KERNEL_RELEASES_BASE }}/$RELEASE_TAG/modules.tar.gz" -o modules.tar.gz
          curl -sL "${{ env.KERNEL_RELEASES_BASE }}/$RELEASE_TAG/build-info.txt" -o build-info.txt

          # Verify downloads
          ls -lh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: kernel-artifacts/
          retention-days: 1

  build-kernel-package:
    needs: download-kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout pmaports
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-pmbootstrap-${{ hashFiles('.github/workflows/build-spx.yml') }}

      - name: Cache pmbootstrap distfiles
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/cache_distfiles
          key: ${{ runner.os }}-${{ runner.arch }}-distfiles-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-distfiles-v1

      - name: Cache APK packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/cache_apk
          key: ${{ runner.os }}-${{ runner.arch }}-apk-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apk-v1

      - name: Cache chroot
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/chroot_native
          key: ${{ runner.os }}-${{ runner.arch }}-chroot-kernel-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chroot-kernel-v1

      - name: Install pmbootstrap
        run: pip install --cache-dir /home/runner/.cache/pip git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git

      - name: Configure pmbootstrap
        run: |
          git -C "$GITHUB_WORKSPACE" remote add upstream https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 upstream main

          printf '[pmbootstrap]\ndevice = microsoft-surface-pro-x\nui = none\nbuild_default_device_arch = True\nextra_packages = none\nboot_size = 256\nextra_space = 0\nhostname = surface-pro-x\nchannel = edge\n' > ~/.config/pmbootstrap_v3.cfg

          mkdir -p $PMBOOTSTRAP_WORK
          echo "8" > $PMBOOTSTRAP_WORK/version
          pmbootstrap --aports "$GITHUB_WORKSPACE" --details-to-stdout work_migrate

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-artifacts
          path: /tmp/kernel-artifacts

      - name: Build kernel package from prebuilt artifacts
        run: |
          PKG_DIR="$GITHUB_WORKSPACE/device/testing/linux-postmarketos-qcom-sc8180x-surface"

          # Copy artifacts to package directory
          cp /tmp/kernel-artifacts/Image.gz "$PKG_DIR/"
          cp /tmp/kernel-artifacts/sc8180x-surface-pro-x.dtb "$PKG_DIR/"
          cp /tmp/kernel-artifacts/modules.tar.gz "$PKG_DIR/"
          cp /tmp/kernel-artifacts/build-info.txt "$PKG_DIR/"

          # Build the package
          pmbootstrap -y --aports "$GITHUB_WORKSPACE" --details-to-stdout build linux-postmarketos-qcom-sc8180x-surface

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages
          path: ${{ env.PMBOOTSTRAP_PACKAGES }}/linux-postmarketos-qcom-sc8180x-surface-*.apk
          retention-days: 30

  build-device:
    needs: [build-firmware, build-kernel-package]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout pmaports
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-pmbootstrap-${{ hashFiles('.github/workflows/build-spx.yml') }}

      - name: Cache pmbootstrap distfiles
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/cache_distfiles
          key: ${{ runner.os }}-${{ runner.arch }}-distfiles-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-distfiles-v1

      - name: Cache APK packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/cache_apk
          key: ${{ runner.os }}-${{ runner.arch }}-apk-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apk-v1

      - name: Cache chroot
        uses: actions/cache@v4
        with:
          path: ${{ env.PMBOOTSTRAP_WORK }}/chroot_native
          key: ${{ runner.os }}-${{ runner.arch }}-chroot-device-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chroot-device-v1

      - name: Install pmbootstrap
        run: pip install --cache-dir /home/runner/.cache/pip git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git

      - name: Configure pmbootstrap
        run: |
          git -C "$GITHUB_WORKSPACE" remote add upstream https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 upstream main

          printf '[pmbootstrap]\ndevice = microsoft-surface-pro-x\nui = none\nbuild_default_device_arch = True\nextra_packages = none\nboot_size = 256\nextra_space = 0\nhostname = surface-pro-x\nchannel = edge\n' > ~/.config/pmbootstrap_v3.cfg

          mkdir -p $PMBOOTSTRAP_WORK
          echo "8" > $PMBOOTSTRAP_WORK/version
          pmbootstrap --aports "$GITHUB_WORKSPACE" --details-to-stdout work_migrate

      - name: Download firmware packages
        uses: actions/download-artifact@v4
        with:
          name: firmware-packages
          path: ${{ env.PMBOOTSTRAP_PACKAGES }}

      - name: Download kernel packages
        uses: actions/download-artifact@v4
        with:
          name: kernel-packages
          path: ${{ env.PMBOOTSTRAP_PACKAGES }}

      - name: Sign pre-built packages and create APKINDEX
        run: |
          # Fix permissions on downloaded artifacts (owned by runner, needs to be writable by pmos in chroot)
          sudo chmod -R a+rwX $PMBOOTSTRAP_WORK/packages/

          # Initialize chroot, create APKINDEX so pmbootstrap recognizes
          # pre-built firmware/kernel and doesn't rebuild them from source
          pmbootstrap -y --aports "$GITHUB_WORKSPACE" --details-to-stdout chroot -- sh -c '
            apk add --no-interactive abuild &&
            su pmos -c "PACKAGER=\"pmos <pmos@local>\" HOME=/home/pmos abuild-keygen -n -q -a" &&
            KEY=$(ls /home/pmos/.abuild/*.rsa 2>/dev/null | head -1) &&
            cp /home/pmos/.abuild/*.rsa.pub /etc/apk/keys/ &&
            cd /mnt/pmbootstrap/packages/edge/aarch64 &&
            apk index --allow-untrusted -o APKINDEX.tar.gz *.apk &&
            abuild-sign -k "$KEY" APKINDEX.tar.gz
          '

      - name: Build device-microsoft-surface-pro-x
        run: pmbootstrap -y --aports "$GITHUB_WORKSPACE" --details-to-stdout build device-microsoft-surface-pro-x

      - name: Build disk image
        run: pmbootstrap -y --aports "$GITHUB_WORKSPACE" --details-to-stdout install --no-fde --password 1234

      - name: Collect artifacts
        run: |
          work="$(pmbootstrap --aports "$GITHUB_WORKSPACE" config work)"
          mkdir -p output

          # Copy built packages
          cp "$work"/packages/edge/aarch64/*.apk output/ || true

          # Copy disk image
          cp "$work"/chroot_native/home/pmos/rootfs/microsoft-surface-pro-x.img output/ || true

          # Compress the disk image
          if [ -f output/microsoft-surface-pro-x.img ]; then
            xz -T0 -6 output/microsoft-surface-pro-x.img
          fi

          ls -lh output/

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: spx-packages
          path: output/*.apk
          retention-days: 30

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: spx-disk-image
          path: output/*.img.xz
          retention-days: 30
